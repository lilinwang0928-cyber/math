<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>錯題本．複習與確認</title>
<style>
:root{
  --paper:#E6F0F8;--card:#FFFFFF;--ink:#0F2A3D;--ink-soft:#55707F;
  --neg:#2563A8;--pos:#C2761A;--zero:#15795B;--ok:#177A5A;--no:#B23C33;
  --rule:#C2D6E5;--rule-soft:#DAE7F1;
  --shadow:0 1px 0 #CBDDEB, 0 10px 26px -18px rgba(15,42,61,.45);
  --serif:"Noto Serif TC","Songti TC","Source Han Serif TC","PMingLiU",serif;
  --sans:"PingFang TC","Microsoft JhengHei","Noto Sans TC","Heiti TC",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);color:var(--ink);background-color:var(--paper);
  background-image:linear-gradient(to right, rgba(37,99,168,.07) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(37,99,168,.07) 1px, transparent 1px);
  background-size:26px 26px;line-height:1.7;-webkit-text-size-adjust:100%}
.wrap{max-width:900px;margin:0 auto;padding:0 14px 80px}
header.top{padding:34px 0 12px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.18em;color:var(--ink-soft);margin:0 0 6px}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(28px,7vw,44px);line-height:1.22;margin:0 0 10px}
h1 .neg{color:var(--neg)}
.sub{margin:0;color:var(--ink-soft);font-size:15px}
nav.stations{position:sticky;top:0;z-index:40;margin:16px -14px 0;padding:8px 14px;
  background:rgba(230,240,248,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--rule);
  overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
nav.stations a.home{display:inline-block;font-family:var(--sans);font-size:13px;font-weight:700;
  color:#fff;background:var(--ink);border:1px solid var(--ink);border-radius:999px;
  padding:6px 14px;margin-right:8px;text-decoration:none;white-space:nowrap}
nav.stations a.home:hover{background:var(--neg);border-color:var(--neg)}
nav.stations button{font-family:var(--sans);font-size:13px;color:var(--ink);background:var(--card);
  border:1px solid var(--rule);border-radius:999px;padding:6px 13px;margin-right:6px;cursor:pointer}
nav.stations button:hover{border-color:var(--neg);color:var(--neg)}

section{margin:32px 0 0;scroll-margin-top:60px}
.sechead{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:6px;flex-wrap:wrap}
.sechead .no{font-family:var(--mono);font-size:13px;color:var(--neg);letter-spacing:.1em}
.sechead h2{font-family:var(--serif);font-size:clamp(20px,4.4vw,26px);margin:0;font-weight:700}
.sechead .cnt{margin-left:auto;font-family:var(--mono);font-size:12.5px;color:var(--ink-soft)}

/* 戰情板 */
.board{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:16px 14px;margin-top:18px;box-shadow:var(--shadow)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
@media (max-width:560px){ .stats{grid-template-columns:1fr 1fr} }
.stat{border:1px solid var(--rule-soft);border-radius:10px;padding:10px 9px;text-align:center;background:#F7FAFD}
.stat b{display:block;font-family:var(--mono);font-size:clamp(20px,5.6vw,27px);line-height:1.2}
.stat span{font-size:11.5px;color:var(--ink-soft);letter-spacing:.06em}
.stat.done b{color:var(--ok)} .stat.todo b{color:var(--no)}
.stat.blank b{color:var(--ink-soft)} .stat.closed b{color:var(--pos)}
.bigbar{height:12px;border-radius:99px;overflow:hidden;margin-top:13px;display:flex;background:var(--rule-soft)}
.bigbar i{display:block;height:100%}
.bigbar i.d{background:var(--ok)} .bigbar i.t{background:var(--no)}
.barkey{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--ink-soft)}
.barkey i{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.units{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:14px}
@media (max-width:560px){ .units{grid-template-columns:1fr 1fr} }
.unit{border:1px solid var(--rule-soft);border-radius:9px;padding:9px}
.unit .h{display:flex;align-items:baseline;gap:6px;font-size:12.5px;color:var(--ink-soft)}
.unit .h b{font-family:var(--mono);font-size:14px;color:var(--ink);margin-left:auto}
.unit .ub{height:5px;background:var(--rule-soft);border-radius:99px;overflow:hidden;margin-top:6px}
.unit .ub i{display:block;height:100%;background:var(--neg)}
.board p.note{margin:12px 0 0;font-size:12.5px;color:var(--ink-soft)}

/* 建議 */
.advice{display:grid;grid-template-columns:1fr;gap:11px;margin-top:14px}
.tip{background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--neg);
  border-radius:10px;padding:12px 13px;box-shadow:var(--shadow)}
.tip.hot{border-left-color:var(--no)}
.tip.good{border-left-color:var(--ok)}
.tip.warm{border-left-color:var(--pos)}
.tip h4{margin:0 0 5px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tip h4 .badge{font-family:var(--mono);font-size:10.5px;background:var(--rule-soft);color:var(--ink-soft);
  border-radius:4px;padding:2px 7px;font-weight:400}
.tip.hot h4 .badge{background:#FBEFEE;color:var(--no)}
.tip.good h4 .badge{background:#EEF7F3;color:var(--ok)}
.tip.warm h4 .badge{background:#FDF2E6;color:var(--pos)}
.tip p{margin:0;font-size:13.5px;color:var(--ink-soft)}
.tip p b{color:var(--ink)}
.tip a{color:var(--neg);font-weight:700;text-decoration:none}
.tip a:hover{text-decoration:underline}

/* 篩選列 */
.bar2{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;align-items:center}
.bar2 .lab{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);letter-spacing:.06em;margin-right:2px}
.bar2 button{font-family:var(--sans);font-size:13px;border:1px solid var(--rule);background:var(--card);
  border-radius:999px;padding:6px 13px;cursor:pointer;color:var(--ink)}
.bar2 button[aria-pressed="true"]{background:var(--neg);border-color:var(--neg);color:#fff}
.bar2 button.act2{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.bar2 button.act2:hover{background:var(--neg);border-color:var(--neg)}
.counter{font-family:var(--mono);font-size:12.5px;color:var(--ink-soft);margin:10px 0 0}

/* 清單 */
.grp{margin-top:16px}
.grph{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;border-bottom:1px solid var(--rule);padding-bottom:5px}
.grph h3{font-family:var(--serif);font-size:17px;margin:0;font-weight:700}
.grph .n{font-family:var(--mono);font-size:12.5px;color:var(--ink-soft);margin-left:auto}
.grph .go{font-size:12.5px;color:var(--neg);text-decoration:none;font-weight:700}
.grph .go:hover{text-decoration:underline}
ul.items{list-style:none;margin:9px 0 0;padding:0}
li.item{display:flex;align-items:flex-start;gap:10px;background:var(--card);border:1px solid var(--rule-soft);
  border-radius:9px;padding:9px 11px;margin-bottom:7px;flex-wrap:wrap}
li.item.todo{border-color:#E8C3BD;background:#FEF8F7}
li.item.closed{background:#F4FBF8;border-color:#BEDFD2}
li.item .st{font-family:var(--mono);font-size:11px;border-radius:4px;padding:2px 7px;white-space:nowrap;flex:none}
li.item .st.d{background:#EEF7F3;color:var(--ok)}
li.item .st.t{background:#FBEFEE;color:var(--no)}
li.item .st.b{background:var(--rule-soft);color:var(--ink-soft)}
li.item .txt{flex:1;min-width:180px;font-size:13.5px;line-height:1.55}
li.item .txt .src{display:block;font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);margin-top:1px}
li.item .txt .src .boss{color:var(--pos)}
li.item .act{display:flex;gap:8px;align-items:center;flex:none}
li.item .act a{font-size:12.5px;color:var(--neg);text-decoration:none;font-weight:700;white-space:nowrap}
li.item .act a:hover{text-decoration:underline}
li.item label{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-soft);cursor:pointer;white-space:nowrap}
li.item label input{width:15px;height:15px;cursor:pointer}
li.item.conf label{color:var(--ok);font-weight:700}
.empty{background:var(--card);border:1px dashed var(--rule);border-radius:11px;padding:24px 16px;text-align:center;margin-top:14px}
.empty p{margin:0 0 6px;font-size:14.5px}
.empty p.s{font-size:13px;color:var(--ink-soft);margin:0}
footer{margin-top:44px;border-top:1px solid var(--rule);padding-top:14px;font-size:12px;color:var(--ink-soft)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

<header class="top">
  <p class="eyebrow">國中數學 1 上 · 單元一～三</p>
  <h1>錯題本<br><span class="neg">複習</span>與確認</h1>
  <p class="sub">這一頁會自動讀取全部 16 份工具的作答紀錄，把<b>還沒對的題目</b>整理出來，並依照目前的狀況給下一步建議。不用手動登記，寫完回來看就會更新。</p>
</header>

<nav class="stations" aria-label="導覽">
  <a class="home" href="index.html">← 總覽</a>
  <button class="jump" data-target="board">戰情板</button>
  <button class="jump" data-target="advice">學習建議</button>
  <button class="jump" data-target="list">錯題清單</button>
</nav>

<section id="board">
  <div class="sechead"><span class="no">01</span><h2>戰情板</h2><span class="cnt" id="updated"></span></div>
  <div class="board">
    <div class="stats">
      <div class="stat done"><b id="sDone">0</b><span>已訂正</span></div>
      <div class="stat todo"><b id="sTodo">0</b><span>答錯待訂正</span></div>
      <div class="stat blank"><b id="sBlank">0</b><span>還沒寫</span></div>
      <div class="stat closed"><b id="sClosed">0</b><span>訂正＋確認</span></div>
    </div>
    <div class="bigbar"><i class="d" id="barD"></i><i class="t" id="barT"></i></div>
    <div class="barkey">
      <span><i style="background:var(--ok)"></i>已訂正</span>
      <span><i style="background:var(--no)"></i>待訂正</span>
      <span><i style="background:var(--rule-soft)"></i>還沒寫</span>
      <span id="pct"></span>
    </div>
    <div class="units" id="units"></div>
    <p class="note">紀錄存在這台裝置的瀏覽器裡，換裝置或換瀏覽器會從頭算。<b>「確認」</b>是你自己勾的：代表這一題你不只寫對，還說得出為什麼。</p>
  </div>
</section>

<section id="advice">
  <div class="sechead"><span class="no">02</span><h2>學習建議</h2><span class="cnt">依目前狀況自動產生</span></div>
  <div class="advice" id="adviceBox"></div>
</section>

<section id="list">
  <div class="sechead"><span class="no">03</span><h2>錯題清單</h2><span class="cnt" id="listCnt"></span></div>
  <div class="bar2">
    <span class="lab">顯示</span>
    <button class="f" data-f="open" aria-pressed="true">待處理</button>
    <button class="f" data-f="todo" aria-pressed="false">只看答錯</button>
    <button class="f" data-f="blank" aria-pressed="false">只看沒寫</button>
    <button class="f" data-f="done" aria-pressed="false">已訂正</button>
    <button class="f" data-f="all" aria-pressed="false">全部</button>
  </div>
  <div class="bar2">
    <span class="lab">分組</span>
    <button class="g" data-g="unit" aria-pressed="true">按單元</button>
    <button class="g" data-g="fam" aria-pressed="false">按錯誤模式</button>
    <button class="act2" id="copyBtn" style="margin-left:auto">複製清單</button>
  </div>
  <p class="counter" id="counter"></p>
  <div id="listBox"></div>
</section>

<footer>錯題本 · 自動讀取 16 份工具的作答紀錄 · 確認紀錄只存在這台裝置的瀏覽器裡。</footer>
</div>

var NKEY = "math-notebook-v1";
var conf = {};
try{ var raw = localStorage.getItem(NKEY); if(raw) conf = JSON.parse(raw) || {}; }catch(e){ conf = {}; }
function saveConf(){ try{ localStorage.setItem(NKEY, JSON.stringify(conf)); }catch(e){} }

var UNAME = { "1": "第一單元", "2": "第二單元", "3": "第三單元", "E": "段考真題", "F": "總測驗・概念" };

/* ---------- 讀取各工具的作答紀錄 ---------- */
function collect(){
  var rows = [];
  CATALOG.forEach(function(tool){
    var st = {};
    try{ var r = localStorage.getItem(tool.k); if(r) st = JSON.parse(r) || {}; }catch(e){ st = {}; }
    tool.tasks.forEach(function(t){
      var rec = st[t.id];
      var status = (rec === undefined) ? "blank" : (rec && rec.ok ? "done" : "todo");
      var ckey = tool.k + "::" + t.id;
      rows.push({
        tool: tool, task: t, status: status,
        ckey: ckey, conf: !!conf[ckey],
        unit: tool.u, fam: t.fam, boss: t.p
      });
    });
  });
  return rows;
}

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* ---------- 戰情板 ---------- */
function paintBoard(rows){
  var d = 0, t = 0, b = 0, c = 0;
  rows.forEach(function(r){
    if(r.status === "done"){ d++; if(r.conf) c++; }
    else if(r.status === "todo") t++;
    else b++;
  });
  var n = rows.length;
  document.getElementById("sDone").textContent = d;
  document.getElementById("sTodo").textContent = t;
  document.getElementById("sBlank").textContent = b;
  document.getElementById("sClosed").textContent = c;
  document.getElementById("barD").style.width = (d / n * 100) + "%";
  document.getElementById("barT").style.width = (t / n * 100) + "%";
  document.getElementById("pct").textContent = "完成度 " + Math.round(d / n * 100) + "%（" + d + " / " + n + " 關）";

  var byU = {};
  rows.forEach(function(r){
    if(!byU[r.unit]) byU[r.unit] = { d: 0, n: 0 };
    byU[r.unit].n++;
    if(r.status === "done") byU[r.unit].d++;
  });
  document.getElementById("units").innerHTML = ["1","2","3","E","F"].map(function(u){
    var o = byU[u] || { d: 0, n: 0 };
    return '<div class="unit"><div class="h"><span>' + UNAME[u] + "</span><b>" + o.d + "/" + o.n + "</b></div>" +
      '<div class="ub"><i style="width:' + (o.n ? o.d / o.n * 100 : 0) + '%"></i></div></div>';
  }).join("");

  var any = d + t;
  document.getElementById("updated").textContent = any ? "已作答 " + any + " 關" : "尚未開始";
  return { d: d, t: t, b: b, c: c, n: n, byU: byU };
}

    if(fresh){
      out.push(tip("", "還沒開過：" + fresh.n, "下一份",
        '依建議順序，這是下一份還沒動過的。 <a href="' + esc(fresh.f) + '">開始</a>'));
    }

    /* 4. 訂正了但還沒確認 */
    var unconf = rows.filter(function(r){ return r.status === "done" && !r.conf; }).length;
    if(unconf > 0 && sum.d >= 10){
      out.push(tip("", "有 " + unconf + " 關寫對了，但還沒勾「確認」", "複習",
        "寫對一次不等於學會。回頭看一下那幾題的解析，如果<b>說得出為什麼</b>就把「確認」勾起來——" +
        "這一欄才是真正的複習紀錄。"));
    }

    /* 5. 全部完成 */
    if(sum.d === sum.n){
      out.push(tip("good", "263 關全部完成", "收工",
        "可以回頭把三份診斷卷和總測驗<b>重寫一次</b>，這次計時，看看速度和穩定度。"));
    }
  }

  out.push('<div style="margin-top:6px"></div>');
  LONGTERM.forEach(function(x){ out.push(tip(x[1], x[0], "考卷長期模式", x[2])); });
  box.innerHTML = out.join("");
}
function tip(cls, title, badge, body){
  return '<div class="tip ' + cls + '"><h4>' + title + '<span class="badge">' + badge + "</span></h4>" +
    "<p>" + body + "</p></div>";
}

/* ---------- 清單 ---------- */
var filt = "open", grpBy = "unit";

function paintList(rows){
  var show = rows.filter(function(r){
    if(filt === "all") return true;
    if(filt === "open") return r.status !== "done";
    if(filt === "todo") return r.status === "todo";
    if(filt === "blank") return r.status === "blank";
    if(filt === "done") return r.status === "done";
    return true;
  });

  document.getElementById("counter").textContent =
    "顯示 " + show.length + " 關" + (filt === "open" ? "（答錯或還沒寫）" : "") +
    "　·　已勾確認 " + rows.filter(function(r){ return r.conf; }).length + " 關";

  var box = document.getElementById("listBox");
  if(!show.length){
    box.innerHTML = '<div class="empty"><p>' +
      (filt === "open" ? "沒有待處理的題目了。" : "這個條件下沒有題目。") + "</p>" +
      '<p class="s">' + (filt === "open" ? "263 關全部寫對了，可以去重寫診斷卷驗收。" : "換一個篩選條件看看。") + "</p></div>";
    return;
  }

  var groups = {};
  show.forEach(function(r){
    var k = grpBy === "unit" ? r.tool.n : r.fam;
    if(!groups[k]) groups[k] = [];
    groups[k].push(r);
  });
  var order = grpBy === "unit"
    ? CATALOG.map(function(t){ return t.n; }).filter(function(n){ return groups[n]; })
    : Object.keys(groups).sort(function(a, b){ return groups[b].length - groups[a].length; });

  box.innerHTML = order.map(function(k){
    var rs = groups[k];
    var link = grpBy === "unit" ? rs[0].tool.f : "";
    return '<div class="grp"><div class="grph"><h3>' + esc(k) + "</h3>" +
      (link ? '<a class="go" href="' + esc(link) + '">打開這一份 →</a>' : "") +
      '<span class="n">' + rs.length + " 關</span></div>" +
      '<ul class="items">' + rs.map(item).join("") + "</ul></div>";
  }).join("");
}

function item(r){
  var st = r.status === "done" ? ["d", "已訂正"] : (r.status === "todo" ? ["t", "待訂正"] : ["b", "還沒寫"]);
  var cls = "item" + (r.status === "todo" ? " todo" : "") +
    (r.status === "done" && r.conf ? " closed conf" : "");
  var href = r.tool.f + (r.task.s ? "#" + r.task.s : "");
  return '<li class="' + cls + '" data-ck="' + esc(r.ckey) + '">' +
    '<span class="st ' + st[0] + '">' + st[1] + "</span>" +
    '<span class="txt">' + esc(r.task.t) +
      '<span class="src">' + esc(r.tool.n) + '　<span class="boss">' + esc(r.boss) + "</span></span></span>" +
    '<span class="act">' +
      '<a href="' + esc(href) + '">去訂正</a>' +
      "<label><input type=\"checkbox\"" + (r.conf ? " checked" : "") + "> 確認</label>" +
    "</span></li>";
}

/* ---------- 綁定 ---------- */
function refresh(){
  var rows = collect();
  var sum = paintBoard(rows);
  paintAdvice(rows, sum);
  paintList(rows);
  window.__rows = rows;
}

document.addEventListener("click", function(ev){
  var f = ev.target.closest(".bar2 button.f");
  if(f){
    filt = f.getAttribute("data-f");
    Array.prototype.forEach.call(document.querySelectorAll(".bar2 button.f"), function(b){
      b.setAttribute("aria-pressed", b === f ? "true" : "false");
    });
    paintList(window.__rows);
    return;
  }
  var g = ev.target.closest(".bar2 button.g");
  if(g){
    grpBy = g.getAttribute("data-g");
    Array.prototype.forEach.call(document.querySelectorAll(".bar2 button.g"), function(b){
      b.setAttribute("aria-pressed", b === g ? "true" : "false");
    });
    paintList(window.__rows);
    return;
  }
});

document.getElementById("listBox").addEventListener("change", function(ev){
  var cb = ev.target;
  if(cb.type !== "checkbox") return;
  var li = cb.closest("li.item");
  var ck = li.getAttribute("data-ck");
  if(cb.checked) conf[ck] = 1; else delete conf[ck];
  saveConf();
  refresh();
});

document.getElementById("copyBtn").addEventListener("click", function(){
  var rows = window.__rows.filter(function(r){ return r.status !== "done"; });
  var byTool = {};
  rows.forEach(function(r){
    if(!byTool[r.tool.n]) byTool[r.tool.n] = [];
    byTool[r.tool.n].push("  ・" + r.task.t + "（" + r.boss + "）" +
      (r.status === "todo" ? " ← 寫過但沒對" : ""));
  });
  var lines = ["【錯題清單】共 " + rows.length + " 關待處理", ""];
  CATALOG.forEach(function(t){
    if(byTool[t.n]){ lines.push(t.n + "（" + byTool[t.n].length + " 關）"); lines = lines.concat(byTool[t.n]); lines.push(""); }
  });
  var text = lines.join("\n");
  var btn = this;
  var done = function(){
    btn.textContent = "已複製";
    setTimeout(function(){ btn.textContent = "複製清單"; }, 1500);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, function(){ fb(text, done); });
  } else fb(text, done);
});
function fb(text, done){
  try{
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); document.body.removeChild(ta); done();
  }catch(e){}
}

Array.prototype.forEach.call(document.querySelectorAll(".jump"), function(b){
  b.addEventListener("click", function(){
    var t = document.getElementById(b.getAttribute("data-target"));
    if(t) t.scrollIntoView({ behavior: "smooth", block: "start" });
  });
});

refresh();
})();
</script>
</body>
</html>
