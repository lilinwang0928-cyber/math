<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>麥斯語錄．108 句中英雙語</title>
<style>
:root{
  --paper:#EEF2F4;--card:#FFFFFF;--ink:#12303C;--ink-soft:#5A737F;
  --neg:#2F5FA8;--pos:#C87814;--zero:#17795C;--ok:#1B7A5C;--no:#B23C33;
  --rule:#C6D5DC;--rule-soft:#DFE8ED;
  --shadow:0 1px 0 #D7E1E6, 0 8px 24px -18px #1c3d4a;
  --serif:"Noto Serif TC","Songti TC","Source Han Serif TC","PMingLiU",serif;
  --sans:"PingFang TC","Microsoft JhengHei","Noto Sans TC","Heiti TC",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;
  --mint:#3FE0B0;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);color:var(--ink);background-color:var(--paper);
  background-image:linear-gradient(to right, rgba(47,95,168,.055) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(47,95,168,.055) 1px, transparent 1px);
  background-size:26px 26px;line-height:1.7;-webkit-text-size-adjust:100%}
.wrap{max-width:900px;margin:0 auto;padding:0 14px 80px}
header.top{padding:34px 0 14px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.18em;color:var(--ink-soft);margin:0 0 6px}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(28px,7vw,44px);line-height:1.22;margin:0 0 10px}
h1 .neg{color:var(--neg)}
.sub{margin:0;color:var(--ink-soft);font-size:15px}
nav.stations{position:sticky;top:0;z-index:40;margin:16px -14px 0;padding:8px 14px;
  background:rgba(238,242,244,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--rule);
  overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
nav.stations button{font-family:var(--sans);font-size:13px;color:var(--ink);background:var(--card);
  border:1px solid var(--rule);border-radius:999px;padding:6px 13px;margin-right:6px;cursor:pointer}
nav.stations button:hover{border-color:var(--neg);color:var(--neg)}

/* 抽卡 */
.draw{background:linear-gradient(180deg,#132633 0%,#17303F 100%);border:1px solid #2A4557;
  border-left:5px solid var(--mint);border-radius:14px;padding:20px 16px 16px;margin-top:18px;
  box-shadow:0 18px 44px -24px rgba(15,42,61,.6);color:#EAF2F6;position:relative;overflow:hidden}
.draw .tagline{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--mint);margin:0 0 8px}
.draw .zh{font-family:var(--serif);font-size:clamp(19px,4.8vw,26px);font-weight:700;line-height:1.55;margin:0 0 10px;color:#fff}
.draw .en{font-size:14.5px;color:#9FB6C2;margin:0;line-height:1.6}
.draw .meta{display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:#7E97A6}
.draw .meta .badge{background:#1E3646;color:var(--mint);border-radius:999px;padding:3px 10px}
.draw .acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.draw .acts button{font-family:var(--sans);font-size:14px;font-weight:700;border:none;border-radius:9px;padding:10px 16px;cursor:pointer}
.draw .acts .go{background:var(--mint);color:#06212C}
.draw .acts .go:hover{background:#7CEBC8}
.draw .acts .ghost{background:transparent;color:var(--mint);border:1px solid #2A4557!important}
.draw .acts .ghost:hover{border-color:var(--mint)!important}

/* 篩選 */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}
.filters button{font-family:var(--sans);font-size:13px;border:1px solid var(--rule);background:var(--card);
  border-radius:999px;padding:6px 13px;cursor:pointer;color:var(--ink)}
.filters button[aria-pressed="true"]{background:var(--neg);border-color:var(--neg);color:#fff}
.filters button.star[aria-pressed="true"]{background:var(--pos);border-color:var(--pos)}
.counter{font-family:var(--mono);font-size:12.5px;color:var(--ink-soft);margin:10px 0 0}

section{margin:30px 0 0;scroll-margin-top:60px}
.sechead{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:6px;flex-wrap:wrap}
.sechead .no{font-family:var(--mono);font-size:13px;color:var(--neg);letter-spacing:.1em}
.sechead h2{font-family:var(--serif);font-size:clamp(19px,4.4vw,25px);margin:0;font-weight:700}
.sechead .en{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--ink-soft)}
.sechead p.desc{flex-basis:100%;margin:6px 0 0;font-size:13px;color:var(--ink-soft)}

ul.lines{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:11px}
@media (max-width:680px){ ul.lines{grid-template-columns:1fr} }
li.line{background:var(--card);border:1px solid var(--rule);border-radius:11px;padding:12px 12px 10px;box-shadow:var(--shadow);position:relative}
li.line.fav{border-color:var(--pos);background:#FFFCF6}
li.line .n{font-family:var(--mono);font-size:11.5px;color:var(--neg);letter-spacing:.06em}
li.line .zh{font-size:15px;font-weight:700;margin:3px 0 6px;line-height:1.6}
li.line .en{font-size:13px;color:var(--ink-soft);line-height:1.55;margin:0}
li.line .tools{display:flex;gap:6px;margin-top:9px}
li.line .tools button{font-family:var(--sans);font-size:12px;border:1px solid var(--rule);background:#F7FAFB;
  border-radius:7px;padding:4px 10px;cursor:pointer;color:var(--ink-soft)}
li.line .tools button:hover{border-color:var(--neg);color:var(--neg)}
li.line .tools .fv[aria-pressed="true"]{background:#FFF3DF;border-color:var(--pos);color:var(--pos)}
li.line .tools .copied{border-color:var(--ok);color:var(--ok)}
.empty{background:var(--card);border:1px dashed var(--rule);border-radius:11px;padding:20px;text-align:center;color:var(--ink-soft);font-size:14px;margin-top:12px}
/* ===== 語音導覽 ===== */
.draw .acts .speak{background:#1E3646;color:var(--mint);border:1px solid #2A4557!important}
.draw .acts .speak:hover{border-color:var(--mint)!important}
.draw .acts .speak.on{background:var(--mint);color:#06212C;border-color:var(--mint)!important}
.voicebar{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:13px 14px;margin-top:14px;box-shadow:var(--shadow)}
.voicebar h4{margin:0 0 9px;font-size:14px;display:flex;align-items:center;gap:8px}
.voicebar h4 .ico{font-size:16px}
.voicebar h4 small{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);font-weight:400}
.voicebar .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.voicebar .row + .row{margin-top:10px}
.voicebar .lab{font-family:var(--mono);font-size:12px;color:var(--ink-soft);letter-spacing:.06em}
.voicebar button{font-family:var(--sans);font-size:13px;border:1px solid var(--rule);background:#F3F8FC;
  border-radius:999px;padding:6px 13px;cursor:pointer;color:var(--ink)}
.voicebar button[aria-pressed="true"]{background:var(--neg);border-color:var(--neg);color:#fff}
.voicebar button.play{background:var(--zero);border-color:var(--zero);color:#fff;font-weight:700}
.voicebar button.play:hover{background:#12674E}
.voicebar button.stop{background:#FBEFEE;border-color:var(--no);color:var(--no);font-weight:700}
.voicebar input[type=range]{flex:1;min-width:130px;max-width:220px}
.voicebar .rate{font-family:var(--mono);font-size:13px;min-width:38px;text-align:right}
.voicebar p.note{margin:9px 0 0;font-size:12.5px;color:var(--ink-soft)}
.voicebar p.warn{margin:9px 0 0;font-size:12.5px;color:var(--no)}
li.line .tools .sp[aria-pressed="true"]{background:#EEF7F3;border-color:var(--ok);color:var(--ok)}
li.line.speaking{border-color:var(--zero);background:#F4FBF8;box-shadow:0 0 0 2px rgba(23,121,92,.14)}
li.line.speaking .zh{color:var(--zero)}
footer{margin-top:44px;border-top:1px solid var(--rule);padding-top:14px;font-size:12px;color:var(--ink-soft)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== 回總覽按鈕 ===== */
nav.stations a.home,nav.toc a.home{
  display:inline-block;font-family:var(--sans);font-size:13px;font-weight:700;
  color:#fff;background:var(--ink);border:1px solid var(--ink);border-radius:999px;
  padding:6px 14px;margin-right:8px;text-decoration:none;white-space:nowrap;
}
nav.stations a.home:hover{background:var(--neg);border-color:var(--neg)}
nav.stations a.home:focus-visible{outline:2px solid var(--neg);outline-offset:2px}

/* ===== 淺藍主題 ===== */
:root{
  --paper:#E6F0F8;          /* 底圖：淺藍 */
  --card:#FFFFFF;
  --ink:#0F2A3D;            /* 深藍墨 */
  --ink-soft:#55707F;
  --neg:#2563A8;            /* 主藍 */
  --pos:#C2761A;            /* 琥珀 */
  --zero:#15795B;
  --ok:#177A5A;
  --no:#B23C33;
  --rule:#C2D6E5;
  --rule-soft:#DAE7F1;
  --shadow:0 1px 0 #CBDDEB, 0 10px 26px -18px rgba(15,42,61,.45);
}
body{
  background-color:var(--paper);
  background-image:
    linear-gradient(to right, rgba(37,99,168,.07) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(37,99,168,.07) 1px, transparent 1px);
  background-size:26px 26px;
}
nav.stations,nav.toc{background:rgba(230,240,248,.94);border-bottom-color:var(--rule)}
.card{border-color:var(--rule)}
.rule-box{background:#F1F7FC;border-left-color:var(--neg)}
input.blank{background:#F3F8FC}
.chip,.cmp .ops button,.opts button,.modes button,.presets button,.numrow button,
.picker button,.nudge button,.varrow button,.factors button{background:#F3F8FC}
th{background:#EEF5FA}
.sechead{border-bottom-color:var(--ink)}
footer{border-top-color:var(--rule)}
</style>
</head>

</div>

<div class="filters" id="filters">
  <button class="cat" data-cat="all" aria-pressed="true">全部 108</button>
  <button class="cat" data-cat="1" aria-pressed="false">① 啟動</button>
  <button class="cat" data-cat="2" aria-pressed="false">② 試錯</button>
  <button class="cat" data-cat="3" aria-pressed="false">③ 策略</button>
  <button class="cat" data-cat="4" aria-pressed="false">④ 恢復</button>
  <button class="cat" data-cat="5" aria-pressed="false">⑤ 聯想</button>
  <button class="cat" data-cat="6" aria-pressed="false">⑥ 考前</button>
  <button class="star" id="favOnly" aria-pressed="false">★ 只看收藏</button>
</div>
<p class="counter" id="counter">顯示 108 句</p>

<div id="list"></div>

<footer>麥斯語錄 · 108 句 · 支援中英語音朗讀 · 收藏紀錄只存在這台裝置的瀏覽器裡。</footer>
</div>

/* ---------- 抽卡 ---------- */
var current = null;
function drawOne(){
  var pool = ALL;
  if(pool.length === 0) return;
  var pick;
  do { pick = pool[Math.floor(Math.random() * pool.length)]; }
  while(pool.length > 1 && current && pick.no === current.no);
  current = pick;
  document.getElementById("dZh").textContent = pick.zh;
  document.getElementById("dEn").textContent = pick.en;
  document.getElementById("dCat").textContent = pick.catName.split("\u3000")[0];
  document.getElementById("dNo").textContent = "NO. " + pick.no;
  var fb = document.getElementById("dFav");
  fb.textContent = favs[pick.no] ? "\u2605 已收藏" : "收藏";
}
document.getElementById("dNext").addEventListener("click", drawOne);
document.getElementById("dCopy").addEventListener("click", function(){
  if(!current) return;
  copyText(current.zh + "\n" + current.en, this, "複製這句");
});
if(document.getElementById("dSpeak")){
  document.getElementById("dSpeak").addEventListener("click", function(){
    var btn = this;
    if(btn.classList.contains("on")){ TTS.stop(); clearSpeakingMarks(); return; }
    if(!current) return;
    clearSpeakingMarks();
    btn.classList.add("on"); btn.textContent = "\u25A0 停止朗讀";
    TTS.speakOne(current, function(){
      btn.classList.remove("on"); btn.textContent = "\u25B6 朗讀";
    });
  });
}
document.getElementById("dFav").addEventListener("click", function(){
  if(!current) return;
  favs[current.no] = !favs[current.no];
  if(!favs[current.no]) delete favs[current.no];
  save();
  this.textContent = favs[current.no] ? "\u2605 已收藏" : "收藏";
  render();
});

function copyText(text, btn, restore){
  var done = function(){
    var old = btn.textContent;
    btn.textContent = "\u5df2\u8907\u88fd";
    btn.classList.add("copied");
    setTimeout(function(){ btn.textContent = restore || old; btn.classList.remove("copied"); }, 1400);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, function(){ fallback(text, done); });
  } else fallback(text, done);
}
function fallback(text, done){
  try{
    var ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", "");
    ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    done();
  }catch(e){}
}

/* ---------- 語音導覽 ---------- */
var TTS = (function(){
  var ok = typeof window !== "undefined" && "speechSynthesis" in window && typeof SpeechSynthesisUtterance !== "undefined";
  var voices = [], zhVoice = null, enVoice = null;
  var mode = "both", rate = 0.95;
  var queue = [], qi = 0, playing = false, onItem = null, onEnd = null;

  function pickVoices(){
    voices = window.speechSynthesis.getVoices() || [];
    function best(prefs){
      for(var p = 0; p < prefs.length; p++){
        for(var i = 0; i < voices.length; i++){
          var lang = (voices[i].lang || "").toLowerCase().replace("_", "-");
          if(lang.indexOf(prefs[p]) === 0) return voices[i];
        }
      }
      return null;
    }
    zhVoice = best(["zh-tw", "zh-hant", "cmn-hant", "zh-hk", "zh"]);
    enVoice = best(["en-us", "en-gb", "en"]);
    var el = document.getElementById("vEngine");
    if(el){
      if(!voices.length) el.textContent = "尚未載入語音";
      else el.textContent = "中文：" + (zhVoice ? zhVoice.name : "無") + "　英文：" + (enVoice ? enVoice.name : "無");
    }
  }

  function say(text, lang, cb){
    if(!ok || !text){ if(cb) cb(); return; }
    var u = new SpeechSynthesisUtterance(text);
    if(lang === "zh"){ if(zhVoice) u.voice = zhVoice; u.lang = zhVoice ? zhVoice.lang : "zh-TW"; }
    else { if(enVoice) u.voice = enVoice; u.lang = enVoice ? enVoice.lang : "en-US"; }
    u.rate = (lang === "zh") ? rate : Math.min(1.3, rate + 0.03);
    u.pitch = 1;
    u.onend = function(){ if(cb) cb(); };
    u.onerror = function(){ if(cb) cb(); };
    window.speechSynthesis.speak(u);
  }

  /* 唸一句（依模式決定中／英／中英） */
  function speakOne(q, done){
    if(!ok){ if(done) done(); return; }
    var steps = [];
    if(mode === "zh" || mode === "both") steps.push(["zh", q.zh]);
    if(mode === "en" || mode === "both") steps.push(["en", q.en]);
    var i = 0;
    (function next(){
      if(i >= steps.length){ if(done) done(); return; }
      var st = steps[i++];
      say(st[1], st[0], next);
    })();
  }

  function stop(){
    playing = false; queue = []; qi = 0;
    if(ok) window.speechSynthesis.cancel();
    if(onEnd) onEnd();
  }

  function playList(items, itemCb, endCb){
    stop();
    if(!ok || !items.length) return;
    queue = items.slice(); qi = 0; playing = true;
    onItem = itemCb; onEnd = endCb;
    (function step(){
      if(!playing || qi >= queue.length){ playing = false; if(onEnd) onEnd(); return; }
      var q = queue[qi++];
      if(onItem) onItem(q);
      speakOne(q, function(){
        if(!playing) return;
        setTimeout(step, 260);   /* 句與句之間留一點呼吸 */
      });
    })();
  }

  if(ok){
    pickVoices();
    if(typeof window.speechSynthesis.onvoiceschanged !== "undefined"){
      window.speechSynthesis.onvoiceschanged = pickVoices;
    }
    /* 有些瀏覽器長句會自動暫停，定時喚醒 */
    setInterval(function(){
      if(playing && window.speechSynthesis.paused) window.speechSynthesis.resume();
    }, 4000);
  }

  return {
    ok: ok,
    speakOne: function(q, done){ stop(); playing = true; speakOne(q, function(){ playing = false; if(done) done(); }); },
    playList: playList,
    stop: stop,
    setMode: function(m){ mode = m; },
    setRate: function(r){ rate = r; },
    isPlaying: function(){ return playing; }
  };
})();

    TTS.stop();

function clearSpeakingMarks(){
  Array.prototype.forEach.call(document.querySelectorAll("li.line.speaking"), function(li){ li.classList.remove("speaking"); });
  Array.prototype.forEach.call(document.querySelectorAll("li.line .sp"), function(b){ b.setAttribute("aria-pressed", "false"); });

  if(ds){ ds.classList.remove("on"); ds.textContent = "\u25B6 朗讀"; }
}

/* 目前畫面上（依篩選）看得到的句子 */
function visibleQuotes(){
  var out = [];
  Array.prototype.forEach.call(document.querySelectorAll("li.line"), function(li){
    var no = li.getAttribute("data-no");
    ALL.forEach(function(q){ if(q.no === no) out.push(q); });

}

var filterCat = "all", favOnly = false;

function render(){
  var box = document.getElementById("list");
  var html = [];
  var shown = 0;
  CATS.forEach(function(c, ci){
    if(filterCat !== "all" && filterCat !== c.id) return;
    var items = ALL.filter(function(q){
      return q.cat === c.id && (!favOnly || favs[q.no]);
    });
    if(!items.length) return;
    shown += items.length;
    html.push('<section id="g' + c.id + '">');
    html.push('<div class="sechead"><span class="no">STAGE ' + c.id + '</span><h2>' + c.name + "</h2>" +
      '<span class="en">' + c.en + "</span>" +
      '<p class="desc">' + c.desc + "</p></div>");
    html.push('<ul class="lines">');
    items.forEach(function(q){
      html.push('<li class="line' + (favs[q.no] ? " fav" : "") + '" data-no="' + q.no + '">' +
        '<span class="n">NO. ' + q.no + "</span>" +
        '<p class="zh">' + q.zh + "</p>" +
        '<p class="en">' + q.en + "</p>" +
        '<div class="tools">' +
          '<button class="fv" aria-pressed="' + (favs[q.no] ? "true" : "false") + '">' + (favs[q.no] ? "\u2605 已收藏" : "\u2606 收藏") + "</button>" +
          '<button class="sp" aria-pressed="false">\uD83D\uDD0A 朗讀</button>' +
          '<button class="cp">複製</button>' +
        "</div></li>");
    });
    html.push("</ul></section>");
  });
  if(!shown) html.push('<p class="empty">這個條件下沒有句子。' + (favOnly ? "先去收藏幾句吧。" : "") + "</p>");
  box.innerHTML = html.join("");
  document.getElementById("counter").textContent =
    "顯示 " + shown + " 句" + (favOnly ? "（只看收藏）" : "") +
    "　·　已收藏 " + Object.keys(favs).length + " 句";
}

    render();
    if(current && current.no === no) document.getElementById("dFav").textContent = favs[no] ? "\u2605 已收藏" : "收藏";
  } else if(ev.target.classList.contains("sp")){
    var btn = ev.target;
    if(btn.getAttribute("aria-pressed") === "true"){ TTS.stop(); clearSpeakingMarks(); return; }
    clearSpeakingMarks();
    btn.setAttribute("aria-pressed", "true");
    li.classList.add("speaking");
    TTS.speakOne(q, function(){
      btn.setAttribute("aria-pressed", "false");
      li.classList.remove("speaking");
    });
  } else if(ev.target.classList.contains("cp")){
    copyText(q.zh + "\n" + q.en, ev.target, "複製");
  }
});

Array.prototype.forEach.call(document.querySelectorAll(".filters .cat"), function(b){
  b.addEventListener("click", function(){
    filterCat = b.getAttribute("data-cat");
    Array.prototype.forEach.call(document.querySelectorAll(".filters .cat"), function(x){
      x.setAttribute("aria-pressed", x === b ? "true" : "false");
    });
    render();
  });
});
document.getElementById("favOnly").addEventListener("click", function(){
  favOnly = !favOnly;
  this.setAttribute("aria-pressed", favOnly ? "true" : "false");
  render();
});

Array.prototype.forEach.call(document.querySelectorAll(".jump"), function(b){
  b.addEventListener("click", function(){
    var t = document.getElementById(b.getAttribute("data-target"));
    if(t) t.scrollIntoView({ behavior: "smooth", block: "start" });
  });
});

drawOne();
render();
})();
</script>
</body>
</html>
