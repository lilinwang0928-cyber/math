<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math 麥斯．道館挑戰</title>
<style>
:root{
  --paper:#101E28;--card:#172C38;--card2:#1E3646;--ink:#EAF2F6;--ink-soft:#9FB6C2;
  --neon:#3FE0B0;--hot:#FF7A45;--gold:#FFC94A;--danger:#FF5C5C;--rule:#2A4557;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans);color:var(--ink);background:var(--paper);line-height:1.7;
  background-image:radial-gradient(circle at 20% 0%, rgba(63,224,176,.10), transparent 45%),
                   radial-gradient(circle at 85% 12%, rgba(255,122,69,.10), transparent 42%);
  background-attachment:fixed;-webkit-text-size-adjust:100%;
}
.wrap{max-width:800px;margin:0 auto;padding:0 14px 120px}

header.top{padding:28px 0 4px;display:flex;gap:12px;align-items:center}
.avatar{width:58px;height:58px;flex:none;object-fit:contain}
.heroblock{display:flex;gap:14px;align-items:flex-end;margin-top:14px;
  background:linear-gradient(180deg,rgba(63,224,176,.07),rgba(63,224,176,0));
  border:1px solid var(--rule);border-radius:14px;padding:12px 14px}
.heroimg{width:120px;height:auto;flex:none;filter:drop-shadow(0 8px 18px rgba(63,224,176,.25))}
.herotxt{flex:1}
.quote{font-family:var(--serif);font-size:16px;color:var(--neon);margin:0 0 6px;font-weight:700}
.tagline.small{font-size:12.5px;margin-top:6px}
@media (max-width:480px){ .heroimg{width:92px} }
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--neon);margin:0}
h1{font-family:var(--serif);font-size:clamp(24px,6vw,34px);margin:0;font-weight:700}
.tagline{margin:6px 0 0;color:var(--ink-soft);font-size:14px}

.statbar{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.stat{flex:1;min-width:120px;background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:8px 10px;text-align:center}
.stat span{display:block;font-size:11px;color:var(--ink-soft);letter-spacing:.08em}
.stat b{font-family:var(--mono);font-size:20px;color:var(--gold)}

h2.sec{font-family:var(--serif);font-size:19px;margin:26px 0 0;border-bottom:1px solid var(--rule);padding-bottom:6px}

.bosses{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
@media (max-width:560px){ .bosses{grid-template-columns:1fr} }
.boss{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:12px;cursor:pointer;text-align:left;color:inherit;font-family:var(--sans);transition:transform .15s ease,border-color .15s ease}
.boss:hover{border-color:var(--neon);transform:translateY(-2px)}
.boss:focus-visible{outline:2px solid var(--neon);outline-offset:3px}
.boss .icon{font-size:22px}
.boss .nm{font-weight:700;font-size:15px;margin:2px 0 3px}
.boss .ds{font-size:12.5px;color:var(--ink-soft);margin:0}
.boss .kills{font-family:var(--mono);font-size:11px;color:var(--gold);margin-top:6px;display:block}

/* battle */
.battle{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:16px 14px;margin-top:16px;display:none}
.battle.on{display:block}
.bhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bhead .nm{font-family:var(--serif);font-size:20px;font-weight:700}
.bhead .icon{font-size:24px}
.bhead .combo{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--hot)}
.hp{height:14px;background:#0C1A22;border:1px solid var(--rule);border-radius:99px;overflow:hidden;margin-top:10px}
.hp i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--danger),var(--hot));transition:width .4s ease}
.hplab{font-family:var(--mono);font-size:11px;color:var(--ink-soft);margin-top:4px}

.qbox{background:var(--card2);border:1px solid var(--rule);border-radius:10px;padding:14px;margin-top:14px}
.qtext{font-family:var(--mono);font-size:clamp(17px,4.6vw,21px);text-align:center;margin:0 0 4px;word-break:break-word}
.qsub{font-size:12.5px;color:var(--ink-soft);text-align:center;margin:0}
.qline{margin-top:10px}
svg.nl{display:block;width:100%;height:auto}
svg.nl .axis,svg.nl .tick{stroke:var(--ink);stroke-width:2;fill:none}
svg.nl .tickm{stroke:var(--ink-soft);stroke-width:1.3}
svg.nl .lbl{font-family:var(--mono);font-size:15px;fill:var(--ink-soft);text-anchor:middle}
svg.nl .dot{fill:var(--neon)}
svg.nl .ptname{font-family:var(--serif);font-style:italic;font-size:19px;fill:var(--neon);text-anchor:middle}

.answers{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px;align-items:center}
.answers .lab{font-size:13px;color:var(--ink-soft)}
input.ans{font-family:var(--mono);font-size:17px;color:var(--ink);background:#0C1A22;border:1px solid var(--rule);
  border-bottom:2px solid var(--neon);border-radius:8px;padding:8px 10px;width:130px;text-align:center}
input.ans:focus{outline:2px solid var(--neon);outline-offset:1px}
input.ans.ok{border-color:var(--neon);color:var(--neon)}
input.ans.no{border-color:var(--danger);color:var(--danger)}
.opbtn{font-family:var(--mono);font-size:17px;min-width:56px;height:44px;border-radius:10px;border:1px solid var(--rule);
  background:#0C1A22;color:var(--ink);cursor:pointer}
.opbtn[aria-pressed="true"]{background:var(--neon);border-color:var(--neon);color:#06212C;font-weight:700}

.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
button.go{font-family:var(--sans);font-weight:700;font-size:15px;border:none;border-radius:10px;padding:11px 20px;cursor:pointer;
  background:var(--neon);color:#06212C;flex:1;min-width:130px}
button.go.ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--rule);flex:none;min-width:auto}
button.go:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* 麥斯 對話 */
.say{display:flex;gap:10px;align-items:flex-start;margin-top:14px;background:#0C1A22;border:1px solid var(--rule);border-left:3px solid var(--neon);border-radius:10px;padding:11px 12px}
.say .mini{width:52px;height:auto;flex:none;object-fit:contain;align-self:center}
.say .txt{font-size:14px}
.say .txt .hype{font-weight:700;color:var(--neon);display:block}
.say .txt .hype.bad{color:var(--hot)}
.say .txt .fact{color:var(--ink-soft);font-size:13.5px}
.say .txt .fact b{color:var(--ink)}

.victory{text-align:center;padding:8px 0 2px}
.victory .big{font-family:var(--serif);font-size:26px;color:var(--gold);font-weight:700}
.victory p{color:var(--ink-soft);font-size:14px;margin:6px 0 0}

.foot{margin-top:34px;border-top:1px solid var(--rule);padding-top:12px;font-size:12px;color:var(--ink-soft)}
.foot a{color:var(--neon)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
(function(){
"use strict";

/* ================= 基礎工具 ================= */
var KEY = "math-maxx-v1";
var save3 = {};
try{ var raw = localStorage.getItem(KEY); if(raw) save3 = JSON.parse(raw) || {}; }catch(e){ save3 = {}; }
if(!save3.kills) save3.kills = {};
if(!save3.exp) save3.exp = 0;
if(!save3.best) save3.best = 0;
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(save3)); }catch(e){} }

function ri(a, b){ return a + Math.floor(Math.random() * (b - a + 1)); }
function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }
function sgn(v){ return v < 0 ? "(\u2212" + Math.abs(v) + ")" : String(v); }
function neg(v){ return v < 0 ? "\u2212" + Math.abs(v) : String(v); }
function round4(v){ return Math.round(v * 10000) / 10000; }

function halfWidth(s){
  return String(s == null ? "" : s)
    .replace(/[\uFF10-\uFF19\uFF21-\uFF3A\uFF41-\uFF5A]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
    .replace(/[\u2212\u2013\u2014\uFF0D\u30FC]/g, "-")
    .replace(/[\uFF0F\u2044]/g, "/").replace(/[\uFF0B]/g, "+")
    .replace(/[\uFF0E\u3002]/g, ".").replace(/[,\uFF0C]/g, "");
}
function parseNum(str){
  var s = halfWidth(str).replace(/\s+/g, " ").trim();
  if(!s) return null;
  var m = s.match(/^([+-]?)(\d+)\s+(\d+)\/(\d+)$/);
  if(m) return (m[1] === "-" ? -1 : 1) * (Number(m[2]) + Number(m[3]) / Number(m[4]));
  m = s.match(/^([+-]?)(\d+)\/(\d+)$/);
  if(m){ if(Number(m[3]) === 0) return null; return (m[1] === "-" ? -1 : 1) * (Number(m[2]) / Number(m[3])); }
  m = s.match(/^[+-]?(\d+\.?\d*|\.\d+)$/);
  if(m) return Number(s);
  return null;
}
function normText(str){
  var s = halfWidth(str).toLowerCase().replace(/\s+/g, "");
  s = s.replace(/[\u00D7\u2217xX*\u00B7]/g, "*");
  s = s.replace(/\^\(([+-]?\d+)\)/g, "^$1").replace(/\*\*/g, "^");
  return s;
}
/* a×10^n 展開成字串（a 為字串數字，如 "5.08"） */
function expandSci(mantissa, n){
  var parts = String(mantissa).split(".");
  var digits = parts[0] + (parts[1] || "");
  var pointAt = parts[0].length + n;          /* 小數點應在 digits 的第幾個位置 */
  var out;
  if(pointAt <= 0){
    out = "0." + new Array(-pointAt + 1).join("0") + digits;
  } else if(pointAt >= digits.length){
    out = digits + new Array(pointAt - digits.length + 1).join("0");
  } else {
    out = digits.slice(0, pointAt) + "." + digits.slice(pointAt);
  }
  return out;
}

/* ================= 數線 SVG ================= */
var VBW = 700, PAD = 28, AXIS = 58, VBH = 92;
function sx(v, min, max){ return PAD + (v - min) / (max - min) * (VBW - 2 * PAD); }
function lineSVG(spec){
  var min = spec.min, max = spec.max, p = [];
  p.push('<svg class="nl" viewBox="0 0 ' + VBW + ' ' + VBH + '" role="img" aria-label="數線">');
  p.push('<line class="axis" x1="' + sx(min, min, max) + '" y1="' + AXIS + '" x2="' + (sx(max, min, max) - 10) + '" y2="' + AXIS + '"/>');
  (spec.minor || []).forEach(function(v){
    p.push('<line class="tickm" x1="' + sx(v, min, max) + '" y1="' + (AXIS - 7) + '" x2="' + sx(v, min, max) + '" y2="' + (AXIS + 7) + '"/>');
  });
  (spec.ticks || []).forEach(function(v){
    p.push('<line class="tick" x1="' + sx(v, min, max) + '" y1="' + (AXIS - 11) + '" x2="' + sx(v, min, max) + '" y2="' + (AXIS + 11) + '"/>');
  });
  (spec.labels || []).forEach(function(o){
    p.push('<text class="lbl" x="' + sx(o.v, min, max) + '" y="' + (AXIS + 28) + '">' + o.t + '</text>');
  });
  (spec.points || []).forEach(function(pt){
    p.push('<circle class="dot" cx="' + sx(pt.v, min, max) + '" cy="' + AXIS + '" r="6"/>');
    p.push('<text class="ptname" x="' + sx(pt.v, min, max) + '" y="' + (AXIS - 16) + '">' + pt.n + '</text>');
  });
  p.push('</svg>');
  return p.join("");
}
function seq(from, to, step){
  var out = [], n = Math.round((to - from) / step);
  for(var i = 0; i <= n; i++) out.push(Math.round((from + i * step) * 1000) / 1000);
  return out;
}

/* ================= 八隻小怪 ================= */
/* 每個 gen() 回傳 { text, sub, extraHTML, type, ans / answers / opts, hint, js(自測用) } */
var BOSSES = [
  {
    id: "sign", icon: "\uD83E\uDD77", name: "負號小偷",
    desc: "專門在異號相加和除法時把負號摸走。",
    gen: function(){
      var mode = ri(1, 3);
      if(mode === 1){
        var a = ri(21, 95), b = ri(10, a - 5);
        return { text: "(" + neg(-a) + ") + " + b + " =", type: "num", ans: -a + b,
          js: "(" + (-a) + ")+(" + b + ")",
          hint: "|" + a + "| 比 |" + b + "| 大，符號要跟著 " + neg(-a) + " 走 → 答案是負的。" };
      }
      if(mode === 2){
        var c = ri(21, 95), d = ri(10, c - 5);
        return { text: c + " + (" + neg(-d) + ") =", type: "num", ans: c - d,
          js: "(" + c + ")+(" + (-d) + ")",
          hint: "這次是正數比較大，答案是正的：" + c + " \u2212 " + d + "。" };
      }
      var dv = ri(3, 15), q = ri(3, 30), s1 = pick([1, -1]), s2 = pick([1, -1]);
      if(s1 > 0 && s2 > 0) s2 = -1;
      var M = dv * q * s1, D = dv * s2;
      return { text: sgn(M) + " \u00F7 " + sgn(D) + " =", type: "num", ans: M / D,
        js: "(" + M + ")/(" + D + ")",
        hint: "先圈出兩個數的符號：" + (s1 === s2 ? "同號 → 商是正的" : "異號 → 商是負的") + "，再算 " + Math.abs(M) + "\u00F7" + Math.abs(D) + "。" };
    }
  },
  {
    id: "halfway", icon: "\uD83D\uDECB\uFE0F", name: "半路休息站",
    desc: "誘惑你把中間值當答案，最後一項偷偷不算。",
    gen: function(){
      var a = ri(10, 45), b = ri(10, 45), c = ri(10, 45), d = ri(10, 45);
      var txt = "(" + neg(-a) + ") \u2212 " + b + " + (" + neg(-c) + ") \u2212 (" + neg(-d) + ") =";
      return { text: txt, sub: "四項都算到才算破關", type: "num", ans: -a - b - c + d,
        js: "(" + (-a) + ")-(" + b + ")+(" + (-c) + ")-(" + (-d) + ")",
        hint: "改成加法是 " + neg(-a) + " " + neg(-b) + " " + neg(-c) + " +" + d + "，共四項——最後那個 \u2212(" + neg(-d) + ") 是加 " + d + "。" };
    }
  },
  {
    id: "mask", icon: "\uD83C\uDFAD", name: "絕對值面具",
    desc: "脫掉面具後一定是正的，很多人忘記這件事。",
    gen: function(){
      if(ri(1, 2) === 1){
        var p1 = ri(-30, -5), q1 = ri(2, 20), r1 = ri(5, 30), s1 = ri(2, 25);
        var in1 = p1 + q1, in2 = r1 - s1;
        return { text: "|" + neg(p1) + " + " + q1 + "| \u2212 |" + r1 + " \u2212 " + s1 + "| =",
          type: "num", ans: Math.abs(in1) - Math.abs(in2),
          js: "Math.abs(" + p1 + "+" + q1 + ")-Math.abs(" + r1 + "-" + s1 + ")",
          hint: "先算裡面：" + neg(in1) + " 和 " + neg(in2) + "，脫掉面具變成 " + Math.abs(in1) + " 和 " + Math.abs(in2) + "，再相減。" };
      }
      var m = ri(3, 12), n = ri(4, 15), k = ri(2, 9), j = ri(3, 20);
      return { text: "|" + m + " \u00D7 (" + neg(-n) + ")| + (" + neg(-k) + ") \u00D7 " + j + " =",
        type: "num", ans: Math.abs(m * -n) + (-k * j),
        js: "Math.abs(" + m + "*" + (-n) + ")+(" + (-k) + ")*" + j,
        hint: "前面脫掉面具是 +" + (m * n) + "（正的），後面是 " + neg(-k * j) + "，兩個異號要相減。" };
    }
  },
  {
    id: "bracket", icon: "\uD83D\uDD10", name: "括號變號官",
    desc: "括號前是減號時，他只讓你變第一項的號。",
    gen: function(){
      var a = ri(20, 90), b = ri(5, 60), c = ri(5, 60), s = pick(["+", "-"]);
      var inner = (s === "+") ? (b + c) : (b - c);
      return { text: a + " \u2212 (" + b + " " + (s === "+" ? "+" : "\u2212") + " " + c + ") =",
        sub: "括號前是減號", type: "num", ans: a - inner,
        js: a + "-(" + b + (s === "+" ? "+" : "-") + c + ")",
        hint: "拆開後是 " + a + " \u2212 " + b + " " + (s === "+" ? "\u2212" : "+") + " " + c + "：裡面<b>每一項</b>都要變號。" };
    }
  },
  {
    id: "mirror", icon: "\uD83E\uDE9E", name: "鏡子不等號",
    desc: "他會把你的大於小於整個照鏡子反過來。",
    gen: function(){
      var mode = ri(1, 3), a, b, ta, tb;
      if(mode === 1){ a = ri(-40, 40); b = ri(-40, 40); if(a === b) b = a + 1; ta = neg(a); tb = neg(b); }
      else if(mode === 2){
        var m1 = (ri(10, 99) / 10), n1 = ri(-6, 6), m2 = (ri(10, 99) / 10), n2 = ri(-6, 6);
        if(m1 === m2 && n1 === n2) n2 = n2 + 1;
        a = m1 * Math.pow(10, n1); b = m2 * Math.pow(10, n2);
        ta = m1.toFixed(1) + "\u00D710^" + neg(n1); tb = m2.toFixed(1) + "\u00D710^" + neg(n2);
      } else {
        a = -ri(11, 60) / 10; b = -ri(11, 60) / 10; if(a === b) b = a - 0.1;
        ta = neg(round4(a)); tb = neg(round4(b));
      }
      var right = a > b ? ">" : (a < b ? "<" : "=");
      return { text: ta + "　\u25A1　" + tb, sub: "開口要朝比較大的數", type: "op",
        opts: [">", "<", "="], ans: right,
        hint: "把兩邊化成同一種形式再比；寫完從左往右唸一次「" + ta + " " + (right === ">" ? "大於" : "小於") + " " + tb + "」。" };
    }
  },
  {
    id: "twins", icon: "\uD83D\uDC65", name: "雙解雙胞胎",
    desc: "|a| 反推時，他會藏起原點另一邊那個答案。",
    gen: function(){
      var k = pick([ri(3, 40), ri(11, 99) / 10]);
      return { text: "若 |a| = " + k + "，則 a =", sub: "兩格都要填（順序不拘）", type: "pair",
        answers: [k, -k],
        hint: "距離原點 " + k + " 的點有<b>左右兩個</b>：" + k + " 和 " + neg(-k) + "。" };
    }
  },
  {
    id: "format", icon: "\uD83D\uDCE1", name: "格式沒讀到",
    desc: "他讓你算對了數字，卻忘了題目要科學記號。",
    gen: function(){
      var digits = ri(1, 9) + "." + ri(0, 9) + ri(0, 9);
      var mant = String(Number(digits));                  /* 去掉尾端 0 */
      var n = pick([ri(3, 7), -ri(3, 7)]);
      var shown = expandSci(mant, n);
      return { text: "把 " + shown + " 寫成科學記號", sub: "輸入格式範例：6.3*10^6 或 6.3*10^-6",
        type: "text", answers: [mant + "*10^" + n, mant + "*10^(" + n + ")"],
        hint: "a 必須落在 1 到 10 之間；小數點搬了 " + Math.abs(n) + " 位，" + (n < 0 ? "極小數 → 指數為負" : "大數 → 指數為正") + "。" };
    }
  },
  {
    id: "scale", icon: "\uD83D\uDCCF", name: "刻度陷阱",
    desc: "他把每一段切成不同格數，賭你不會先數。",
    gen: function(){
      var m = pick([2, 4, 5, 10]);                  /* 每一整數段被切成幾格 */
      var base = ri(-3, 2);                          /* 點落在 base ~ base+1 之間 */
      var k = ri(1, m - 1);
      var v = round4(base + k / m);
      var min = -4.4, max = 3.4;
      var minor = [];
      for(var t = -4; t < 3; t++){
        for(var j = 1; j < m; j++) minor.push(round4(t + j / m));
      }
      return { text: "P 點的座標是多少？", sub: "先數這一段被切成幾格", type: "scale",
        answers: [round4(1 / m), v],
        extraHTML: lineSVG({ min: min, max: max, ticks: seq(-4, 3, 1),
          minor: minor, labels: seq(-4, 3, 1).map(function(x){ return { v: x, t: neg(x) }; }),
          points: [{ n: "P", v: v }] }),
        hint: "整數之間被切成 " + m + " 格 → 一格 = " + round4(1 / m) + "；P 在 " + neg(base) + " 右邊第 " + k + " 格 → " + neg(v) + "。" };
    }
  }
];

/* ================= 麥斯台詞 ================= */
var HYPE_OK = [
  "破防！這一刀切得漂亮！",
  "火力全開 Max！觀眾席都站起來了！",
  "乾淨俐落，這題連渣都沒剩！",
  "看到沒？這就是練過的手感！",
  "命中要害！小怪的血條在噴！"
];
var HYPE_COMBO = [
  "COMBO \u00D7{n}！停不下來了啦！",
  "{n} 連擊！這節奏太猛了！",
  "連續 {n} 發不失手，教練我想打職業！"
];
var HYPE_BAD = [
  "警報！{boss} 就是在這一步出手的！",
  "被偷襲了！{boss} 剛剛從這裡溜過去——",
  "血條沒掉沒關係，情報到手了！{boss} 的招式是這樣：",
  "喔喔，{boss} 這招很陰！我們看一下它動了哪裡："
];
var HYPE_WIN = [
  "擊倒！{boss} 倒下了！這場你打得漂亮！",
  "{boss} 退場！經驗值直接暴增！",
  "GG！{boss} 被你完全破解，下一隻要不要試試？"
];

/* ================= 狀態 ================= */
var cur = null, curQ = null, hp = 0, MAXHP = 5, combo = 0, answered = false, pickedOp = null;

function el(id){ return document.getElementById(id); }
function esc(t){ return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

function renderStats(){
  var kills = 0;
  for(var k in save3.kills){ if(Object.prototype.hasOwnProperty.call(save3.kills, k)) kills += save3.kills[k]; }
  el("stKills").textContent = kills;
  el("stCombo").textContent = save3.best;
  el("stExp").textContent = save3.exp;
}
function renderBossList(){
  el("bossList").innerHTML = BOSSES.map(function(b){
    var n = save3.kills[b.id] || 0;
    return '<button class="boss" data-id="' + b.id + '" type="button">' +
      '<span class="icon">' + b.icon + '</span>' +
      '<p class="nm">' + b.name + '</p>' +
      '<p class="ds">' + b.desc + '</p>' +
      '<span class="kills">' + (n ? "已擊倒 " + n + " 次" : "尚未挑戰") + '</span></button>';
  }).join("");
}
function say(kind, hype, fact){
  var face = el("sayFace"), src = el(kind === "bad" ? "artThink" : "artWin");
  if(face && src) face.src = src.src;
  el("sayTxt").innerHTML = '<span class="hype' + (kind === "bad" ? " bad" : "") + '">' + hype + '</span>' +
    (fact ? '<span class="fact">' + fact + '</span>' : "");
}
function renderHp(){
  el("bHp").style.width = (hp / MAXHP * 100) + "%";
  el("bHpLab").textContent = "小怪 HP " + hp + " / " + MAXHP + "　（答對一題扣 1 滴血）";
  el("bCombo").textContent = combo >= 2 ? "COMBO \u00D7" + combo : "";
}
function newQuestion(){
  curQ = cur.gen();
  answered = false; pickedOp = null;
  var html = '<p class="qtext">' + curQ.text + "</p>";
  if(curQ.sub) html += '<p class="qsub">' + curQ.sub + "</p>";
  if(curQ.extraHTML) html += '<div class="qline">' + curQ.extraHTML + "</div>";
  html += '<div class="answers">';
  if(curQ.type === "op"){
    html += curQ.opts.map(function(o){
      return '<button class="opbtn" type="button" data-op="' + esc(o) + '" aria-pressed="false">' + esc(o) + "</button>";
    }).join("");
  } else if(curQ.type === "pair"){
    html += '<input class="ans" inputmode="text" aria-label="解一"> <span class="lab">或</span> <input class="ans" inputmode="text" aria-label="解二">';
  } else if(curQ.type === "scale"){
    html += '<span class="lab">一格 =</span><input class="ans" aria-label="一格"> <span class="lab">P =</span><input class="ans" aria-label="座標">';
  } else {
    html += '<input class="ans" inputmode="text" aria-label="答案">';
  }
  html += "</div>";
  el("qbox").innerHTML = html;
  el("submit").textContent = "出招！";
  var first = el("qbox").querySelector("input.ans");
  if(first) first.focus();
}
function judge(){
  var inputs = Array.prototype.slice.call(el("qbox").querySelectorAll("input.ans"));
  if(curQ.type === "op"){
    if(!pickedOp){ say("bad", "還沒選符號啦！", "選一個再出招。"); return null; }
    return pickedOp === curQ.ans;
  }
  if(inputs.some(function(i){ return i.value.trim() === ""; })){
    say("bad", "欄位還空著！", "填滿再出招，麥斯等你。"); return null;
  }
  if(curQ.type === "text"){
    var want = curQ.answers.map(normText);
    var got = normText(inputs[0].value);
    var ok0 = want.indexOf(got) >= 0;
    inputs[0].className = "ans " + (ok0 ? "ok" : "no");
    return ok0;
  }
  if(curQ.type === "pair"){
    var vals = inputs.map(function(i){ return parseNum(i.value); }).sort(function(a, b){ return a - b; });
    var want2 = curQ.answers.slice().sort(function(a, b){ return a - b; });
    var ok2 = vals.length === want2.length;
    for(var i = 0; i < want2.length; i++){ if(Math.abs((vals[i] === null ? NaN : vals[i]) - want2[i]) > 0.005) ok2 = false; }
    inputs.forEach(function(inp){
      var v = parseNum(inp.value);
      var hit = curQ.answers.some(function(w){ return v !== null && Math.abs(v - w) <= 0.005; });
      inp.className = "ans " + (hit ? "ok" : "no");
    });
    return ok2;
  }
  if(curQ.type === "scale"){
    var okAll = true;
    inputs.forEach(function(inp, idx){
      var v = parseNum(inp.value);
      var hit = v !== null && Math.abs(v - curQ.answers[idx]) <= 0.005;
      inp.className = "ans " + (hit ? "ok" : "no");
      if(!hit) okAll = false;
    });
    return okAll;
  }
  var v0 = parseNum(inputs[0].value);
  var ok = v0 !== null && Math.abs(v0 - curQ.ans) <= 0.005;
  inputs[0].className = "ans " + (ok ? "ok" : "no");
  return ok;
}
function startBattle(b){
  cur = b; hp = MAXHP; combo = 0;
  el("bIcon").textContent = b.icon;
  el("bName").textContent = b.name;
  el("battle").classList.add("on");
  renderHp();
  newQuestion();
  say("ok", "「" + b.name + "」出現了！大腦火力 Max，我們上！", b.desc);
  el("battle").scrollIntoView({ behavior: "smooth", block: "start" });
}

el("bossList").addEventListener("click", function(ev){
  var b = ev.target.closest(".boss");
  if(!b) return;
  var id = b.getAttribute("data-id");
  var boss = BOSSES.filter(function(x){ return x.id === id; })[0];
  if(boss) startBattle(boss);
});
el("qbox").addEventListener("click", function(ev){
  var b = ev.target.closest(".opbtn");
  if(!b) return;
  pickedOp = b.getAttribute("data-op");
  Array.prototype.forEach.call(el("qbox").querySelectorAll(".opbtn"), function(x){
    x.setAttribute("aria-pressed", x === b ? "true" : "false");
  });
});
el("qbox").addEventListener("keydown", function(ev){
  if(ev.key === "Enter"){ ev.preventDefault(); el("submit").click(); }
});

el("submit").addEventListener("click", function(){
  if(!cur) return;
  if(cur.__dead){ cur.__dead = false; startBattle(cur); return; }
  if(answered){ newQuestion(); return; }
  var res = judge();
  if(res === null) return;
  answered = true;
  el("submit").textContent = "下一題 \u2192";
  if(res){
    combo++;
    if(combo > save3.best) save3.best = combo;
    save3.exp += 10 + (combo >= 3 ? 5 : 0);
    hp--;
    renderHp();
    if(hp <= 0){
      save3.kills[cur.id] = (save3.kills[cur.id] || 0) + 1;
      save3.exp += 50;
      persist(); renderStats(); renderBossList();
      el("qbox").innerHTML = '<div class="victory"><img src="' + el("artWin").src +
        '" alt="" style="width:150px;height:auto;display:block;margin:0 auto 6px"><p class="big">K.O.</p>' +
        "<p>" + pick(HYPE_WIN).replace("{boss}", cur.name) + "</p>" +
        "<p>這一場連擊最高 " + combo + "，經驗值 +" + (50 + combo * 10) + "。</p></div>";
      say("ok", "擊倒 " + cur.name + "！", "牠的招式你已經看穿了：" + cur.desc + " 下次在考卷上遇到，你就知道要先檢查哪裡。");
      el("submit").textContent = "再打一次";
      answered = true;
      cur.__dead = true;
      return;
    }
    var hype = combo >= 3 ? pick(HYPE_COMBO).replace("{n}", combo) : pick(HYPE_OK);
    say("ok", hype, "小怪還剩 " + hp + " 滴血，繼續。");
  } else {
    combo = 0;
    renderHp();
    say("bad", pick(HYPE_BAD).replace("{boss}", cur.name), curQ.hint);
  }
  persist(); renderStats();
});
el("quit").addEventListener("click", function(){
  el("battle").classList.remove("on");
  cur = null; curQ = null;
  window.scrollTo({ top: 0, behavior: "smooth" });
});

renderStats();
renderBossList();

})();
</script>
</body>
</html>
